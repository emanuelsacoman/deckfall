@if (auth.isAdmin()) {
<a class="skip-link" href="#admin-content">Ir para o conteúdo</a>
<div class="admin-shell">
  <aside class="sidebar" aria-label="Área administrativa">
    <a class="brand" routerLink="/admin/dashboard"><span class="brand-mark" aria-hidden="true">D</span><span>Deckfall<small>Administração</small></span></a>
    <nav aria-label="Menu principal">
      <a routerLink="/admin/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Painel</a>
      <p class="nav-label">Cartas</p>
      <a routerLink="/admin/cartas/lista" routerLinkActive="active" ariaCurrentWhenActive="page">Todas as cartas</a>
      <a routerLink="/admin/cartas/criar" routerLinkActive="active" ariaCurrentWhenActive="page">Criar carta</a>
      <p class="nav-label">Usuários</p>
      <a routerLink="/admin/usuarios/lista" routerLinkActive="active" ariaCurrentWhenActive="page">Todos os usuários</a>
      <a routerLink="/admin/usuarios/criar" routerLinkActive="active" ariaCurrentWhenActive="page">Vincular perfil</a>
    </nav>
    <div class="sidebar-footer">
      <p class="muted">{{ auth.currentUser()?.email }}</p>
      <a class="button secondary" routerLink="/login">Minha conta</a>
      <button class="button secondary" type="button" (click)="logout()" [disabled]="signingOut()">{{ signingOut() ? 'Saindo…' : 'Encerrar sessão' }}</button>
    </div>
  </aside>
  <main id="admin-content" class="admin-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
} @else {
  <main class="admin-content"><p class="notice" role="status">Verificando acesso…</p></main>
}
